description = "Report recorded Bonden measurements and their limits"
prompt = "# Bonden Evidence\n\nReport measurements actually recorded for Bonden or the current task. One-shot: change no files or mode.\n\nWhen no comparison has been measured, say: \"No comparative gains have been measured for Bonden.\"\n\nFor each available measurement, identify the compared revisions or conditions, what was measured, the source, and its limits. Keep completed checks separate from claims about reliability, code size, speed, or cost. Upstream Ponytail benchmark results describe that upstream revision; they do not establish gains for Bonden.\n\nFor the current project's shortcut ledger or code review, point to `/bonden-debt` or `/bonden-audit`. Report observed facts without inventing a version of the work that was never built.\n"
