description = "Quick reference for bonden levels, skills, and commands"
prompt = "Show the bonden quick reference. One shot, change nothing: do not switch mode, write flag files, or persist anything. Levels: /bonden lite (follow the requested approach, mention a smaller option when it materially helps), /bonden (full, choose the simplest complete solution and verify it), /bonden ultra (challenge costly assumptions with a concrete alternative, resolve consequential scope choices, then follow through). Every level requires completion and verification. Commands: /bonden-review (over-engineering review of the current changes), /bonden-audit (whole-repo over-engineering audit), /bonden-debt (harvest shortcut: comments into a tracked ledger), /bonden-gain (recorded measurements and their limits), /bonden-help (this card). Deactivate with 'stop bonden', 'normal mode', or /bonden off; resume anytime with /bonden. Default mode is full; change it with the BONDEN_DEFAULT_MODE environment variable (off|lite|full|ultra) or a config file at ~/.config/bonden/config.json (Windows: %APPDATA%\\bonden\\config.json) with {\"defaultMode\": \"lite\"}. Resolution order: env var, then config file, then full."
